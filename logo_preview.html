<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WCS Survey Editor — Fenesta</title>
<style>
  :root {
    --wcs-primary:#0B3D91; --wcs-ink:#101828; --wcs-muted:#667085;
    --wcs-border:#E4E9F0; --wcs-bg:#F8FAFC;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--wcs-bg);
    font-family:'Segoe UI','Inter',system-ui,sans-serif; color:var(--wcs-ink);
    padding:24px;
  }
  /* ---- Slim branded top bar (mirrors the Streamlit app header) ---- */
  .wcs-header {
    background:#fff; border:1px solid var(--wcs-border);
    border-left:3px solid var(--wcs-primary);
    padding:8px 16px; border-radius:6px;
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px; max-width:1400px; margin-inline:auto;
  }
  .wcs-title { display:flex; align-items:center; gap:10px; }
  .wcs-logo-img { height:26px; width:auto; display:block; }
  .wcs-divider { width:1px; height:20px; background:var(--wcs-border); display:inline-block; }
  .wcs-title h1 { font-size:14px; margin:0; font-weight:600; color:var(--wcs-ink); }
  .wcs-meta { font-size:11px; color:var(--wcs-muted); }

  /* ---- Centered hero (mirrors the empty-state welcome screen) ---- */
  .empty-hero {
    background:#fff; border:1px solid var(--wcs-border); border-radius:8px;
    padding:40px 28px; text-align:center; max-width:1400px; margin:0 auto;
  }
  .hero-logo-img { height:64px; width:auto; margin:0 auto 18px auto; display:block; }
  .empty-hero h2 { margin:0 0 6px 0; font-size:20px; font-weight:600; }
  .empty-hero p { margin:0 auto; color:var(--wcs-muted); font-size:13px; max-width:620px; }
  .legend { margin-top:20px; display:flex; gap:16px; justify-content:center; font-size:12px; color:var(--wcs-muted); }
  .chip { display:inline-block; padding:1px 7px; border-radius:4px; font-size:11px; font-weight:700; }
  .chip-warn { background:#FFEB3B; color:#000; }
  .chip-danger { background:#FF3B30; color:#fff; }
</style>
</head>
